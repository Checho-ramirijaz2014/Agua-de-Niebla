[build-system]
requires = ["poetry-core>=1.0.0", "poetry-dynamic-versioning>=1.0.0,<2.0.0"]
build-backend = "poetry_dynamic_versioning.backend"

[tool.poetry]
name = "amaru"
version = "0.5.0"
authors = [
    "Sergio Ramírez <sergio.ramrez@uc.cl>",
]
maintainers = [
    "Sergio Ramírez <sergio.ramrez@uc.cl>",
]   
description = "A package designed to download .nc from the GOES series"
readme = "README.md"
repository = "https://github.com/Checho-ramirijaz2014/Agua-de-Niebla"
license = "LICENSE"
requires-python = ">=3.7"
keywords = ["GOES", "GOES16", "satellite", "moisture", "fog", "scrapping"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]

[tool.poetry.dependencies]
beautifulsoup4 = "^4.12.3"
lxml = "^5.3.0"
rich = "^13.7.1"
requests = "^2.32.3"
#for dynamic versioning, using git tag
[tool.poetry-dynamic-versioning]
enable = true
vcs = "git"
#pattern = '(?P<base>\d+\.\d+\.\d+)'
#latest-tag = true

[tool.pytest.ini_options]
addopts = "--cov=slapping"
testpaths = [
    "tests",
]